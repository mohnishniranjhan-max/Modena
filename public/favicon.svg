<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="modena-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#1c1c1c" />
    </linearGradient>
    <linearGradient id="modena-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#b70100" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Dark Container -->
  <rect width="512" height="512" rx="140" fill="url(#modena-bg)" />

  <!-- Modena "O" Ring Outer Body -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="42" />

  <!-- Iconic Modena Red Power Symbol Inside the "O" -->
  <path d="M 256 168 A 88 88 0 1 1 176 210" fill="none" stroke="url(#modena-red)" stroke-width="36" stroke-linecap="round" />
  <line x1="256" y1="130" x2="256" y2="216" stroke="url(#modena-red)" stroke-width="36" stroke-linecap="round" />
</svg>