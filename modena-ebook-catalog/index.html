<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modena - Product Catalog</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/ebook.css">
    <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>
    <!-- Top toolbar for web viewing / PDF export -->
    <div id="catalog-toolbar" class="no-print">
        <div class="toolbar-brand">
            Modena Catalog
        </div>
        <div class="toolbar-actions">
            <button id="btn-toc">Table of Contents</button>
            <button id="btn-export-pdf" class="btn-primary">Export to PDF</button>
        </div>
    </div>

    <div id="loading-overlay" class="no-print">
        <div class="spinner"></div>
        <p>Loading Catalog Data...</p>
    </div>

    <!-- The unified container for all catalog pages. Ensures seamless scrolling and flawless printing -->
    <main id="catalog-container" class="book-container">
        <!-- Partials will be injected here sequentially -->
    </main>

    <!-- Scripts -->
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
